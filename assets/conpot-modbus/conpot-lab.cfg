[common]
sensorid = __RELEASE_NAME__

[virtual_file_system]
data_fs_url = default
fs_url = default

[session]
timeout = 30

[daemon]

[json]
enabled = True
filename = /conpot-json-logs/conpot.json

[sqlite]
enabled = False

[syslog]
enabled = False
device = /dev/log
host = localhost
port = 514
facility = local0
socket = dev        ; udp (sends to host:port), dev (sends to device)

[hpfriends]
enabled = False
host = hpfriends.honeycloud.net
port = 20000
channels = ["conpot.events", ]

[taxii]
enabled = False
host = taxiitest.mitre.org
port = 80
inbox_path = /services/inbox/default/
use_https = False

[fetch_public_ip]
enabled = False
urls = ["http://whatismyip.akamai.com/", "http://wgetip.com/"]

[change_mac_addr]
enabled = False
iface = eth0
addr = 00:de:ad:be:ef:00

